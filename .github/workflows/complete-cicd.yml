name: Complete CI/CD Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-test-and-lint:
    name: Complete Build, Unit Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Stage 3 - Install Root Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Stage 4 - Run TypeScript Type Check
        run: |
          npm run typecheck --workspace=web

      - name: Stage 5 - Run Vitest Unit Tests
        run: |
          npm test

      - name: Stage 6 - Build Production Workspaces
        run: |
          npm run build:web
          npm run build:backend
          pwd
          find . -maxdepth 3 -type d -name dist

      - name: Stage 7 - Upload Build Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudy-AI-Production-Bundle
          path: web/dist/
          retention-days: 30
