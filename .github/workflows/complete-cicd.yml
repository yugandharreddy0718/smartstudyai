name: Complete CI/CD Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-test-and-lint:
    name: Complete Build, Unit Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Stage 3 - Install Root Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Stage 4 - Run TypeScript Type Check
        run: |
          npm run typecheck --workspace=web

      - name: Stage 5 - Run Vitest Unit Tests
        run: |
          npm test

      - name: Stage 6 - Build Production Workspaces
        run: |
          npm run build:web
          npm run build:backend

      - name: Stage 7 - Upload Build Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudy-AI-Production-Bundle
          path: dist/
          retention-days: 30

  deploy-web-app:
    name: Deploy Production Web App to GitHub Pages
    needs: build-test-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install & Build Production App
        run: |
          npm install --legacy-peer-deps
          npm run build:web

      - name: Deploy Production App to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: app
          branch: gh-pages
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
