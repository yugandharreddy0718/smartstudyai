name: Android Appium E2E Automation & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e-pipeline:
    name: Android E2E Pipeline (21 Stages)
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v7

      # Stage 2: Setup Node.js 20.x
      - name: Stage 2 - Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # Stage 3: Setup Java
      - name: Stage 3 - Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Stage 4: Install Dependencies & Prepare Standardized Report Directories
      - name: Stage 4 - Install Project Dependencies & Setup Standardized Directories
        run: |
          mkdir -p "Test Results/Mobile/reports/latest"
          mkdir -p "Test Results/Mobile/excel"
          mkdir -p "Test Results/Mobile/screenshots"
          mkdir -p "Test Results/Mobile/logs"
          mkdir -p "Test Results/Mobile/Summary"
          npm install --legacy-peer-deps
          cd appium-tests && npm install --legacy-peer-deps && cd ..
          cd automation && npm install --legacy-peer-deps && cd ..

      # Stage 4.5: Dependency Diagnostic Step
      - name: Stage 4.5 - Diagnostic WebdriverIO Dependency Check
        run: |
          cd appium-tests && node -e "console.log('✅ WebdriverIO module path:', require.resolve('webdriverio'))" && cd ..

      # Stage 5-17: Execute Appium E2E Automation Suite & Report Compilation
      - name: Stage 5-17 - Execute Appium Suite & Compile Reports
        run: |
          node appium-tests/runner.js || node automation/runners/testRunner.js

      # Stage 18: Upload Deliverables as Artifacts
      - name: Stage 18 - Upload Mobile Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartstudy-mobile-reports
          path: Test Results/Mobile/
          retention-days: 30

      # Validation Step Immediately Before Publishing
      - name: Stage 18.5 - Validate Generated Mobile Reports & Print Paths
        run: |
          echo "==================================================="
          echo "   VALIDATING GENERATED MOBILE REPORTS DIRECTORY   "
          echo "==================================================="
          if [ ! -d "Test Results/Mobile" ]; then
            echo "[ERROR] Standardized directory 'Test Results/Mobile' does not exist!"
            exit 1
          fi
          echo "Contents of Test Results/Mobile:"
          ls -la "Test Results/Mobile"
          
          if [ ! -f "Test Results/Mobile/reports/latest/index.html" ] && [ ! -f "Test Results/Mobile/reports/latest/appium-report.html" ] && [ ! -f "Test Results/Mobile/appium-report.html" ]; then
            echo "[ERROR] HTML Report file missing in Test Results/Mobile!"
            exit 1
          fi

          if [ ! -f "Test Results/Mobile/excel/appium-report.xlsx" ] && [ ! -f "Test Results/Mobile/appium-report.xlsx" ]; then
            echo "[ERROR] Excel Report file missing in Test Results/Mobile!"
            exit 1
          fi

          echo "✅ HTML Report verified:"
          ls -la "Test Results/Mobile/reports/latest/" || ls -la "Test Results/Mobile/"
          echo "✅ Excel Report verified:"
          ls -la "Test Results/Mobile/excel/" || ls -la "Test Results/Mobile/"

      # Stage 19 & 20: Publish Reports to GitHub Pages
      - name: Stage 19-20 - Publish Live Reports to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: always()
        continue-on-error: true
        with:
          folder: Test Results/Mobile
          target-folder: reports/latest
          branch: gh-pages
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Stage 21: Publish GitHub Action Summary
      - name: Stage 21 - Publish GitHub Action Summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            try {
              const summaryPath = path.resolve('Test Results/Mobile/Summary/summary.md');
              if (fs.existsSync(summaryPath)) {
                const summaryContent = fs.readFileSync(summaryPath, 'utf8');
                core.summary.addRaw(summaryContent).write();
              } else {
                core.summary.addRaw("## Android Appium E2E Automation Summary\n\nExecution completed successfully.").write();
              }
            } catch (e) {
              console.log('Failed to append job summary: ' + e.message);
            }
