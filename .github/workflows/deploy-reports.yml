name: GitHub Pages Report Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android Appium E2E Automation & CI/CD Pipeline", "Selenium Web E2E Automation & CI/CD Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  deploy-reports-to-pages:
    name: Publish Real QA & Test Reports to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2 & 3 - Download E2E Report Artifacts & Print Diagnostic Locations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            fs.mkdirSync('Test Results/Mobile', { recursive: true });
            fs.mkdirSync('Test Results/Web', { recursive: true });

            console.log("Current working directory (pwd):", process.cwd());

            console.log("Fetching repository artifact metadata via GitHub API...");
            const artifactsResp = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const artifacts = artifactsResp.data.artifacts || [];
            console.log(`Found ${artifacts.length} total artifacts in repository.`);

            // Search for mobile artifact
            const mobileArtifact = artifacts.find(a => a.name === 'smartstudy-mobile-reports' && !a.expired);
            if (mobileArtifact) {
              console.log(`Downloading Mobile Report Artifact ID: ${mobileArtifact.id} (Created: ${mobileArtifact.created_at})...`);
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: mobileArtifact.id,
                archive_format: 'zip'
              });
              fs.writeFileSync('mobile-reports.zip', Buffer.from(download.data));
              execSync('unzip -o mobile-reports.zip -d "Test Results/Mobile"');
              fs.unlinkSync('mobile-reports.zip');
              console.log("✅ Mobile report artifact extracted into Test Results/Mobile/");
            } else {
              console.log("⚠️ No non-expired 'smartstudy-mobile-reports' artifact found in repository.");
            }

            // Search for web artifact
            const webArtifact = artifacts.find(a => a.name === 'smartstudy-web-reports' && !a.expired);
            if (webArtifact) {
              console.log(`Downloading Web Report Artifact ID: ${webArtifact.id} (Created: ${webArtifact.created_at})...`);
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: webArtifact.id,
                archive_format: 'zip'
              });
              fs.writeFileSync('web-reports.zip', Buffer.from(download.data));
              execSync('unzip -o web-reports.zip -d "Test Results/Web"');
              fs.unlinkSync('web-reports.zip');
              console.log("✅ Web report artifact extracted into Test Results/Web/");
            } else {
              console.log("⚠️ No non-expired 'smartstudy-web-reports' artifact found in repository.");
            }

      - name: Stage 4 - Strict Validation of Reconstructed Test Results & Reports
        run: |
          echo "==================================================="
          echo "   STRICT VALIDATION OF RECONSTRUCTED REPORTS      "
          echo "==================================================="
          
          HAS_ERROR=false

          echo "Working directory (pwd):"
          pwd

          if [ ! -d "Test Results" ]; then
            echo "❌ [ERROR] Directory 'Test Results' does not exist!"
            HAS_ERROR=true
          else
            echo "✅ 'Test Results' directory exists."
          fi

          if [ ! -d "Test Results/Mobile" ]; then
            echo "❌ [ERROR] Directory 'Test Results/Mobile' does not exist!"
            HAS_ERROR=true
          else
            echo "✅ 'Test Results/Mobile' directory exists."
          fi

          if [ ! -d "Test Results/Web" ]; then
            echo "❌ [ERROR] Directory 'Test Results/Web' does not exist!"
            HAS_ERROR=true
          else
            echo "✅ 'Test Results/Web' directory exists."
          fi

          echo "📁 Discovering Test Results Directories (find 'Test Results' -maxdepth 5 -type d):"
          find "Test Results" -maxdepth 5 -type d | sort

          echo "📄 Discovering Test Results Files (find 'Test Results' -maxdepth 5 -type f):"
          find "Test Results" -maxdepth 5 -type f | sort

          MOBILE_HTML=$(find "Test Results/Mobile" -name "*.html" | head -n 1)
          MOBILE_EXCEL=$(find "Test Results/Mobile" -name "*.xlsx" | head -n 1)
          WEB_HTML=$(find "Test Results/Web" -name "*.html" | head -n 1)
          WEB_EXCEL=$(find "Test Results/Web" -name "*.xlsx" | head -n 1)

          echo "---------------------------------------------------"
          echo "📄 Discovered Report File Paths:"
          echo "  1. Mobile HTML Report:  ${MOBILE_HTML:-MISSING}"
          echo "  2. Mobile Excel Report: ${MOBILE_EXCEL:-MISSING}"
          echo "  3. Web HTML Report:     ${WEB_HTML:-MISSING}"
          echo "  4. Web Excel Report:    ${WEB_EXCEL:-MISSING}"
          echo "---------------------------------------------------"

          if [ -z "$MOBILE_HTML" ]; then
            echo "❌ [ERROR] Mobile HTML Report file is missing!"
            HAS_ERROR=true
          fi

          if [ -z "$MOBILE_EXCEL" ]; then
            echo "❌ [ERROR] Mobile Excel Report file is missing!"
            HAS_ERROR=true
          fi

          if [ -z "$WEB_HTML" ]; then
            echo "❌ [ERROR] Web HTML Report file is missing!"
            HAS_ERROR=true
          fi

          if [ -z "$WEB_EXCEL" ]; then
            echo "❌ [ERROR] Web Excel Report file is missing!"
            HAS_ERROR=true
          fi

          if [ "$HAS_ERROR" = true ]; then
            echo "❌ [FATAL] Report validation failed! One or more required report files or directories are missing."
            exit 1
          fi

          echo "✅ Strict Report Validation PASSED 100%!"

          # Prepare deployment directory without spaces for deployment action compatibility
          cp -r "Test Results" deploy-results
          echo "✅ Deployment mirror 'deploy-results' prepared cleanly."

          echo "📁 Discovering deploy-results Files (find deploy-results -maxdepth 5 -type f):"
          find deploy-results -maxdepth 5 -type f | sort

      - name: Stage 5 - Deploy Reconstructed Reports to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-results
          target-folder: reports
          branch: gh-pages
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
