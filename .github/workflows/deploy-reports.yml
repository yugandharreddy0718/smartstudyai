name: GitHub Pages Report Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android Appium E2E Automation & CI/CD Pipeline", "Selenium Web E2E Automation & CI/CD Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-reports-to-pages:
    name: Publish QA & Test Reports to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Live Reports to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Test Results
          target-folder: reports
          branch: gh-pages
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
